# Calibrated Franka FR3 / Panda Dynamic Parameters
# Formatted for MuJoCo (frictionloss, damping, armature) and PhysX/USD (jointFriction, physics:damping)
# Assumes FCI interface (link-side torque loop active; reflected motor inertia masked)

joint1:
  dynamic:
    K: 7000.0             # Structural / flexspline drive stiffness (Nm/rad)
    D: 1.0                # Drive damping
    friction: 0.75        # Nominal joint friction (Nm)
    mu_coulomb: 0.75      # Coulomb breakaway threshold (frictionloss / jointFriction) [Nm]
    mu_viscous: 0.35      # Linear viscous drag (damping / physics:damping) [Nms/rad]
    damping: 0.35         # Direct mirror for engines expecting 'damping'
    armature: 0.0         # 0.0 due to FCI link-side active torque loop
    motor_inertia: 0.00004206399  # Raw unscaled rotor inertia (kg·m²)
    gear_ratio: 120.0

